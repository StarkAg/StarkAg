name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - stats.svg
      - reactor.svg
      - README.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Generate reactor ASCII art
        run: python3 scripts/gen_reactor_ascii.py > /dev/null

      - name: Update recent-activity section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_recent_activity.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg reactor.svg README.md
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Auto-update profile stats"
          git push
